<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoxNoteAI</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f3ee;
      --ink: #1a1814;
      --muted: #8a8680;
      --accent: #1a1814;
      --btn-bg: #1a1814;
      --btn-fg: #f5f3ee;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'DM Mono', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    /* subtle grain */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      text-align: center;
      animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .label {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      font-weight: 300;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.6rem;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(3.2rem, 9vw, 6rem);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.02em;
      color: var(--ink);
      margin-bottom: 0.5rem;
    }

    h1 em {
      font-style: italic;
      color: var(--muted);
    }

    .sub {
      font-size: 0.72rem;
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.08em;
      margin-bottom: 3.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--btn-bg);
      color: var(--btn-fg);
      text-decoration: none;
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 1rem 2rem;
      border-radius: 0;
      transition: background 0.2s, color 0.2s, transform 0.15s;
      position: relative;
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      border: 1px solid var(--ink);
      transform: translate(4px, 4px);
      transition: transform 0.15s;
    }

    .btn:hover {
      background: var(--bg);
      color: var(--ink);
      transform: translate(-2px, -2px);
    }

    .btn:hover::after {
      transform: translate(6px, 6px);
    }

    .btn svg {
      width: 14px;
      height: 14px;
    }

    .meta {
      margin-top: 2.5rem;
      font-size: 0.62rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      line-height: 2;
    }

    .meta span {
      display: inline-block;
      margin: 0 0.6rem;
    }

    .divider {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--ink);
      opacity: 0.06;
      transform: translateY(-50%);
      z-index: 0;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="divider"></div>

  <div class="wrap">
    <h1>Vox<em>Note</em>AI</h1>
    <p class="sub">Voice recording, powered by AI</p>

    <a class="btn"
       href="https://github.com/user-attachments/files/28245299/VoxNoteAI.zip"
       download>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 2v8M5 7l3 3 3-3"/>
        <path d="M2 12h12"/>
      </svg>
      Download for macOS
    </a>

    <p class="meta">
      <span>Only works on Apple Silicon</span>·
      <span>Free</span>
    </p>
  </div>
</body>
</html>
